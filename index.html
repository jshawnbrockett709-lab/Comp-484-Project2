<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Giga Pet - The Varrock Animal Shelter</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="An OSRS inspired Giga Pet game">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header class="title-bar">
      <h1>Varrock Animal Shelter</h1>
      <p class="subtitle">Choose a pet, then keep it happy and healthy.</p>
    </header>

    <!-- Pet selector tabs are generated by script.js from the pets array -->
    <nav class="pet-tabs" aria-label="Choose a pet"></nav>

    <main>
      <!-- LEFT PANEL: the pet stage -->
      <section class="panel pet-image-container">
        <img class="pet-image" src="images/hound.png" alt="Your Giga Pet">
        <div class="pet-shadow"></div>
      </section>

      <!-- RIGHT PANEL: stats and actions -->
      <section class="panel dashboard">
        <div class="stat-row">Name: <strong class="name"></strong></div>
        <div class="stat-row">Weight: <strong><span class="weight"></span> pounds</strong></div>

        <div class="stat-row">Happiness: <strong><span class="happiness"></span> tail wags (per min)</strong></div>
        <div class="bar"><div class="bar-fill happiness-bar"></div></div>

        <!-- NEW STAT for the new action button: Energy (restored by Napping) -->
        <div class="stat-row">Energy: <strong><span class="energy"></span> / 100</strong></div>
        <div class="bar"><div class="bar-fill energy-bar"></div></div>

        <div class="button-container">
          <button class="treat-button">Treat</button>
          <button class="play-button">Play</button>
          <button class="exercise-button">Exercise</button>
          <!-- NEW ACTION BUTTON for EC-->
          <button class="nap-button">Nap</button>
        </div>
        <button class="sound-button" aria-pressed="true">Sound: On</button>
      </section>
    </main>

    <!-- Chatbox: shows a comment from the pet after every button press -->
    <section class="chatbox" aria-live="polite"></section>

    <script src="https://code.jquery.com/jquery-2.2.1.min.js"
            integrity="sha256-gvQgAFzTH6trSrAWoH1iPo9Xc96QxSZ3feW6kem+O00="
            crossorigin="anonymous"></script>
    <script src="script.js"></script>
  </body>
</html>
